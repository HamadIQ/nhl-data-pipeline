name: NHL ETL Pipeline

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  run-etl:
    name: Run NHL ETL Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        
      - name: Verify input data exists
        run: |
          test -f data/raw/nhl_shots_data.csv
      
      - name: Fetch player names
        run: python fetch_players.py

      - name: Transform shot data
        run: python nhl_etl_pipeline.py
      
      - name: Aggregate player statistics
        run: python aggregate_player_stats.py
      
      - name: Generate CSV and Parquet outputs
        run: python compress_file.py
      
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-nhl-etl-role
          aws-region: us-east-1
      
      - name: Sync Outputs to S3 Bucket
        run: |
          aws s3 sync data/compressed/ s3://nhl-etl-analytics-dev-storage/ --exclude "*" --include "*.csv" --include "*.parquet" --delete

